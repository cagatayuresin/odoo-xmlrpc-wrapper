name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies and package
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps --editable .
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q src tests examples
      - name: Lint and check formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run unit and security regression tests with coverage
        run: |
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report --show-missing --fail-under=90

  coverage:
    name: Codecov coverage
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked dependencies and package
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps --editable .
          python -m pip check
      - name: Generate and check coverage report
        run: |
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report --show-missing --fail-under=90
          python -m coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          flags: unittests
          name: python-3.13
          fail_ci_if_error: true

  package:
    name: Build and installed package smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Build source distribution and wheel
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --require-hashes -r requirements.txt
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
      - name: Verify import outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import odoo_xmlrpc_wrapper
          from odoo_xmlrpc_wrapper import Bot

          assert callable(Bot)
          assert "site-packages" in Path(odoo_xmlrpc_wrapper.__file__).parts
          assert odoo_xmlrpc_wrapper.__version__ == version("odoo_xmlrpc_wrapper")
          print(f"Installed odoo_xmlrpc_wrapper {version('odoo_xmlrpc_wrapper')}")
          PY
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v

  security:
    name: Python ${{ matrix.python-version }} and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked security tools
        id: install
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Scan Python code with Bandit
        run: python -m bandit -r src
      - name: Audit runtime dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit --strict --require-hashes -r requirements.txt
      - name: Audit development and build dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pip_audit --strict --require-hashes -r requirements-dev.txt
      - name: Scan GitHub Actions security with zizmor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: zizmor --offline .github/workflows

  trivy:
    name: Trivy vulnerabilities, configuration and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Include the development lock as well as requirements.txt.
          TRIVY_FILE_PATTERNS: 'pip:requirements.*\.txt'
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table
          timeout: 10m
          cache: false
          cache-dir: ${{ runner.temp }}/trivy-cache
          skip-dirs: .git,.venv,venv,build,dist,.trivy-cache,.audit-reports
