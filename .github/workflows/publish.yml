name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build:
    name: Build and verify release distributions
    if: >-
      github.repository == 'cagatayuresin/odoo-xmlrpc-wrapper' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Require a stable tag matching the package version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match stable package version {version!r}")
          PY
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Build and validate source distribution and wheel
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/release-test"
          "$RUNNER_TEMP/release-test/bin/python" -m pip install --require-hashes -r requirements.txt
          "$RUNNER_TEMP/release-test/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-test/bin/python" -m pip check
      - name: Test the installed release outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/release-test/bin/python" -I - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path
          import odoo_xmlrpc_wrapper
          from odoo_xmlrpc_wrapper import Bot

          assert callable(Bot)
          assert "site-packages" in Path(odoo_xmlrpc_wrapper.__file__).parts
          assert odoo_xmlrpc_wrapper.__version__ == version("odoo-xmlrpc-wrapper")
          assert f"v{odoo_xmlrpc_wrapper.__version__}" == os.environ["GITHUB_REF_NAME"]
          PY
          "$RUNNER_TEMP/release-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Preserve the verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/odoo-xmlrpc-wrapper/
    permissions:
      id-token: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
